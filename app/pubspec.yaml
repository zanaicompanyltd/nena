name: nena
description: Sign Language to Swahili Speech Synthesis App (TSL/KSL → Swahili TTS)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Camera streaming for real-time frame capture
  camera: ^0.10.5+9

  # State management for voice profile toggle
  provider: ^6.1.2

  # Text-to-Speech engine (Swahili voice output)
  flutter_tts: ^4.0.2

  # HTTP requests to your AI backend (Google Colab / Flask API)
  http: ^1.2.1

  # Persistent storage for user profile settings
  shared_preferences: ^2.2.3

  # WebRTC — bidirectional VoIP call engine (Stream A + B)
  flutter_webrtc: ^0.10.0

  # Microphone recording for Whisper ASR (inbound audio)
  record: ^5.0.4

  # Runtime permissions (microphone, camera)
  permission_handler: ^11.3.0

  # Beautiful icons
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
